<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Ripley</title>
</head>
<body>

    <!-- Encabezado superior -->
    <header>
        <nav class="navegacion-superior">
            <!-- Botón / Icono de ubicación -->
            <button type="button" aria-label="Ubicación">
                <img src="" alt="Ubicación">
            </button>

            <!-- Barra de búsqueda -->
            <div class="barra-busqueda">
                <img src="" alt="Buscar">
                <input type="search" placeholder="Buscar en Ripley...">
            </div>

            <!-- Carrito de compras -->
            <button type="button" aria-label="Carrito">
                <img src="" alt="Carrito">
            </button>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>
        <!-- Banner 1: Carrusel principal -->
        <section class="carrusel-principal">
            <img src="" alt="Me fascina verte bien con Ester Expósito">
            <!-- Puntos de navegación del carrusel (4 en total) -->
            <div class="puntos-carrusel">
                <span class="punto activo"></span>
                <span class="punto"></span>
                <span class="punto"></span>
                <span class="punto"></span>
            </div>
        </section>

        <!-- Banner 2: Teletón -->
        <section class="banner-promocional">
            <a href="#">
                <img src="" alt="Teletón #TodosLosDias - ¡Dona aquí!">
            </a>
        </section>

        <!-- Banner 3: Navidad -->
        <section class="banner-promocional">
            <a href="#">
                <img src="" alt="Feliz Navidad - Me fascina verte bien">
            </a>
        </section>
    </main>

    <!-- Menú de navegación inferior fijo -->
    <footer>
        <nav class="navegacion-inferior">
            <ul>
                <li>
                    <a href="#">
                        <img src="" alt="">
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="" alt="">
                        <span>Menú</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="" alt="">
                        <span>Mi Cuenta</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="" alt="">
                        <span>Cupones</span>
                    </a>
                </li>
            </ul>
        </nav>
    </footer>

</body>
</html>
