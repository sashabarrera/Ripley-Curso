<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/style.css">
    <title>Carro de Compras</title>
</head>

<body>

    <div class="contenedor">

        <!-- Encabezado -->
        <div class="encabezado">
            <span class="atras">
                </span>
                    <h2>Carro de compras(0)</h2>
        </div>

        <!-- Pasos del proceso -->
        <div class="pasos">
            <div class="paso">
                <div class="circulo">1</div>
                <p>Carro</p>
            </div>
            <div class="linea"></div>
            <div class="paso">
                <div class="circulo">2</div>
                <p>Entrega</p>
            </div>
            <div class="linea"></div>
            <div class="paso">
                <div class="circulo">3</div>
                <p>Pago</p>
            </div>
        </div>

        <!-- Caja de productos -->
        <div class="caja-productos">
            <input type="checkbox">
            <div class="texto">
                <p class="titulo">Todos los productos</p>
                <p class="subtitulo">0 de 0 productos seleccionado</p>
            </div>
        </div>

        <!-- Separador horizontal -->
        <hr class="separador">

        <!-- Pie de página -->
        <div class="pie">
            <p>Todos medios de pago</p>
            <p>Ripley Crédito</p>
            <button class="btn-continuar">Continuar compra</button>
        </div>

    </div>

</body>

</html>
