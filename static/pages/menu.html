<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Menú de Categorías - Ripley</title>
</head>

<body>
    <!-- Encabezado superior -->
    <header>
        <nav class="navegacion-superior">
            <!-- Botón / Icono de ubicación -->
            <button type="button" aria-label="Ubicación">
                <img src="/static/images/ubicacion ripley.png" alt="Ubicación">
            </button>

            <!-- Barra de búsqueda -->
            <div class="barra-busqueda">
                <img src="/static/images/lupa ripley.png" alt="Buscar">
                <input type="search" placeholder="Buscar en Ripley...">
            </div>

            <!-- Carrito de compras -->
            <button type="button" aria-label="Carrito">
                <img src="/static/images/carrito ripley.png" alt="Carrito">
            </button>
        </nav>
    </header>

    <!-- Contenido principal: Grilla de categorías -->
    <main>
        <section class="contenedor-categorias">
            <!-- TARJETA 1 BELLEZA -->
            <article class="tarjeta-categoria">
                <a href="/static/pages/belleza.html">
                    <img src="/static/images/belleza ripley.png" alt="Belleza">
                    <p>Belleza</p>
                </a>
            </article>

            <!-- TARJETA 2 TECNO -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="/static/images/tecno ripley.png" alt="Tecno">
                    <p>Tecno</p>
                </a>
            </article>

            <!-- TARJETA 3 ZAPATOS Y ZAPATILLAS -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="/static/images/Zapato y zapatillas ripley.png" alt="Zapatos y Zapatillas">
                    <p>Zapatos y Zapatillas</p>
                </a>
            </article>

            <!-- TARJETA 4 DECORACION -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="/static/images/decoracion ripley.png" alt="Decoración">
                    <p>Decoración</p>
                </a>
            </article>

            <!-- TARJETA 5 AUTOMOTRIZ -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="/static/images/automotriz ripley.png" alt="Automotriz">
                    <p>Automotriz</p>
                </a>
            </article>

            <!-- TARJETA 6 ELECTRO -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="/static/images/electro ripley.png" alt="Electro">
                    <p>Electro</p>
                </a>
            </article>

            <!-- TARJETA 7 FERRETERIA -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="/static/images/ferreteria ripley.png" alt="Ferretería">
                    <p>Ferretería</p>
                </a>
            </article>

            <!-- TARJETA 8 MASCOTAS -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="/static/images/mascota ripley.png" alt="Mascotas">
                    <p>Mascotas</p>
                </a>
            </article>

            <!-- TARJETA 9 OUTLET -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="/static/images/outlet ripley.png" alt="Outlet">
                    <p>Outlet</p>
                </a>
            </article>
        </section>
    </main>

    <!-- Menú de navegación inferior -->
    <footer>
        <nav class="navegacion-inferior">
            <ul>
                <li>
                    <a href="/index.html">
                        <img src="/static/images/casa ripley.png" alt="Inicio">
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/static/pages/menu.html">
                        <img src="/static/images/menu ripley.png" alt="Menu">
                        <span>Menú</span>
                    </a>
                </li>
                <li>
                    <a href="/static/pages/user.html">
                        <img src="/static/images/cuenta ripley.png" alt="Cuenta">
                        <span>Mi Cuenta</span>
                    </a>
                </li>
                <li>
                    <a href="/static/pages/cupones.html">
                        <img src="/static/images/descuento ripley.png" alt="Cupones">
                        <span>Cupones</span>
                    </a>
                </li>
            </ul>
        </nav>
    </footer>
</body>

</html>
