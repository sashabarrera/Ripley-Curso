<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Categorías - Ripley</title>
</head>

<body>
    <!-- Encabezado superior -->
    <header>
        <nav class="navegacion-superior">
            <!-- Botón / Icono de ubicación -->
            <button type="button" aria-label="Ubicación">
                <img src="" alt="Ubicación">
            </button>

            <!-- Barra de búsqueda -->
            <div class="barra-busqueda">
                <img src="" alt="Buscar">
                <input type="search" placeholder="Buscar en Ripley...">
            </div>

            <!-- Carrito de compras -->
            <button type="button" aria-label="Carrito">
                <img src="" alt="Carrito">
            </button>
        </nav>
    </header>

    <!-- Contenido principal: Grilla de categorías -->
    <main>
        <section class="contenedor-categorias">
            <!-- TARJETA 1 BELLEZA -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="" alt="Belleza">
                    <p>Belleza</p>
                </a>
            </article>

            <!-- TARJETA 2 TECNO -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="" alt="Tecno">
                    <p>Tecno</p>
                </a>
            </article>

            <!-- TARJETA 3 ZAPATOS Y ZAPATILLAS -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="" alt="Zapatos y Zapatillas">
                    <p>Zapatos y Zapatillas</p>
                </a>
            </article>

            <!-- TARJETA 4 DECORACION -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="" alt="Decoración">
                    <p>Decoración</p>
                </a>
            </article>

            <!-- TARJETA 5 AUTOMOTRIZ -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="" alt="Automotriz">
                    <p>Automotriz</p>
                </a>
            </article>

            <!-- TARJETA 6 ELECTRO -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="" alt="Electro">
                    <p>Electro</p>
                </a>
            </article>

            <!-- TARJETA 7 FERRETERIA -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="" alt="Ferretería">
                    <p>Ferretería</p>
                </a>
            </article>

            <!-- TARJETA 8 MASCOTAS -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="" alt="Mascotas">
                    <p>Mascotas</p>
                </a>
            </article>

            <!-- TARJETA 9 OUTLET -->
            <article class="tarjeta-categoria">
                <a href="#">
                    <img src="" alt="Outlet">
                    <p>Outlet</p>
                </a>
            </article>
        </section>
    </main>

    <!-- Menú de navegación inferior -->
    <footer>
        <nav class="navegacion-inferior">
            <ul>
                <li>
                    <a href="#">
                        <img src="" alt="">
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="" alt="">
                        <span>Menú</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="" alt="">
                        <span>Mi Cuenta</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="" alt="">
                        <span>Cupones</span>
                    </a>
                </li>
            </ul>
        </nav>
    </footer>
</body>

</html>
