<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - Ripley</title>
</head>

<body>
    <!-- Encabezado superior -->
    <header>
        <nav class="navegacion-superior">
            <!-- Botón / Icono de ubicación -->
            <button type="button" aria-label="Ubicación">
                <img src="" alt="Ubicación">
            </button>

            <!-- Barra de búsqueda -->
            <div class="barra-busqueda">
                <img src="" alt="Buscar">
                <input type="search" placeholder="Buscar en Ripley...">
            </div>

            <!-- Carrito de compras -->
            <button type="button" aria-label="Carrito">
                <img src="" alt="Carrito">
            </button>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>
        <!-- Sección de datos del usuario -->
        <section class="tarjeta-usuario">
            <div class="imagen-perfil">
                <img src="" alt="Foto de perfil">
            </div>
            <p>Hola</p>
            <h1>NOMBRE</h1>
            <p>Los puntos</p>
        </section>

        <!-- Opciones del menú de usuario -->
        <nav class="opciones-usuario">
            <ul>
                <li>
                    <a href="/perfil">
                        <img src="" alt="">
                        <span>Mi perfil</span>
                    </a>
                </li>
                <li>
                    <a href="/direcciones">
                        <img src="" alt="">
                        <span>Mis direcciones</span>
                    </a>
                </li>
                <li>
                    <a href="/compras">
                        <img src="" alt="">
                        <span>Mis compras</span>
                    </a>
                </li>
                <li>
                    <a href="/cupones">
                        <img src="" alt="">
                        <span>Mis cupones</span>
                    </a>
                </li>
                <li>
                    <a href="/puntos">
                        <img src="" alt="">
                        <span>RipleyPuntos Go</span>
                    </a>
                </li>
                <li>
                    <a href="/contactanos">
                        <img src="" alt="">
                        <span>Contáctanos</span>
                    </a>
                </li>
                <li>
                    <a href="/solicitudes">
                        <img src="" alt="">
                        <span>Solicitudes de atención</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Configuración adicional -->
        <section class="opciones-configuracion">
            <div class="opcion-huella">
                <img src="" alt="">
                <p class="titulo-opcion">Paga con lector de huella digital</p>
                <p class="descripcion-opcion">Usa tu huella digital para confirmar tu pago</p>
            </div> 
            <div class="opcion-cerrar-sesion"> 
                <img src="" alt="">
                <button type="button">Cerrar sesión</button>
            </div>
        </section>
    </main>

    <!-- Menú de navegación inferior -->
    <footer>
        <nav class="navegacion-inferior">
            <ul>
                <li>
                    <a href="#">
                        <img src="icono-inicio.svg" alt="">
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="icono-menu.svg" alt="">
                        <span>Menú</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="icono-cuenta.svg" alt="">
                        <span>Mi Cuenta</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="icono-cupones.svg" alt="">
                        <span>Cupones</span>
                    </a>
                </li>
            </ul>
        </nav>
    </footer>
</body>

</html>
