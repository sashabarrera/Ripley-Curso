<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Mi Cuenta - Ripley</title>
</head>

<body>
    <!-- Encabezado superior -->
    <header>
        <nav class="navegacion-superior">
            <!-- Botón / Icono de ubicación -->
            <button type="button" aria-label="Ubicación">
                <img src="/static/images/ubicacion ripley.png" alt="Ubicación">
            </button>

            <!-- Barra de búsqueda -->
            <div class="barra-busqueda">
                <img src="/static/images/lupa ripley.png" alt="Buscar">
                <input type="search" placeholder="Buscar en Ripley...">
            </div>

            <!-- Carrito de compras -->
            <button type="button" aria-label="Carrito">
                <img src="/static/images/carrito ripley.png" alt="Carrito">
            </button>
        </nav>
    </header>

    <!-- Contenido principal -->
    <main>
        <!-- Sección de datos del usuario -->
        <section class="tarjeta-usuario">
            <div class="imagen-perfil">
                <img src="/static/images/cuenta ripley.png" alt="Foto de perfil">
            </div>
            <p>Hola</p>
            <h1>NOMBRE</h1>
            <p>Los puntos</p>
        </section>

        <!-- Opciones del menú de usuario -->
        <nav class="opciones-usuario">
            <ul>
                <li>
                    <a href="/perfil">
                        <img src="/static/images/personita user ripley.png" alt="Perfil">
                        <span>Mi perfil</span>
                    </a>
                </li>
                <li>
                    <a href="/direcciones">
                        <img src="/static/images/ubicacion ripley.png" alt="Dirreciones">
                        <span>Mis direcciones</span>
                    </a>
                </li>
                <li>
                    <a href="/compras">
                        <img src="/static/images/miscompras ripley.png" alt="Compras">
                        <span>Mis compras</span>
                    </a>
                </li>
                <li>
                    <a href="/cupones">
                        <img src="/static/images/descuento ripley.png" alt="Cupones">
                        <span>Mis cupones</span>
                    </a>
                </li>
                <li>
                    <a href="/puntos">
                        <img src="/static/images/puntos ripley.png" alt="Puntos">
                        <span>RipleyPuntos Go</span>
                    </a>
                </li>
                <li>
                    <a href="/contactanos">
                        <img src="/static/images/conctactanos ripley.png" alt="Contactanos">
                        <span>Contáctanos</span>
                    </a>
                </li>
                <li>
                    <a href="/solicitudes">
                        <img src="/static/images/solicituddeAtencion ripley.png" alt="Solucitudes de atencion">
                        <span>Solicitudes de atención</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Configuración adicional -->
        <section class="opciones-configuracion">
            <div class="opcion-huella">
                <img src="/static/images/paga ripley.png" alt="Dectector de huella">
                <p class="titulo-opcion">Paga con lector de huella digital</p>
                <p class="descripcion-opcion">Usa tu huella digital para confirmar tu pago</p>
            </div> 
            <div class="opcion-cerrar-sesion"> 
                <img src="/static/images/cerrarSesion ripley.png" alt="Cerrar sesion">
                <button type="button">Cerrar sesión</button>
            </div>
        </section>
    </main>

    <!-- Menú de navegación inferior -->
    <footer>
        <nav class="navegacion-inferior">
            <ul>
                <li>
                    <a href="/index.html">
                        <img src="/static/images/casa ripley.png" alt="Inicio">
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/static/pages/menu.html">
                        <img src="/static/images/menu ripley.png " alt="Menu">
                        <span>Menú</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="/static/images/cuenta ripley.png" alt="Cuenta">
                        <span>Mi Cuenta</span>
                    </a>
                </li>
                <li>
                    <a href="/static/pages/cupones.html">
                        <img src="/static/images/descuento ripley.png" alt="Cupones">
                        <span>Cupones</span>
                    </a>
                </li>
            </ul>
        </nav>
    </footer>
</body>

</html>
